[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowloop"
version = "0.1.0"
description = "Sentence-level repetition trainer for English shadowing practice"
requires-python = ">=3.9"
dependencies = [
    "gradio>=4.0",
    "openai-whisper",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
